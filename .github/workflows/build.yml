
name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list_installed

      - name: Extract ZIP
        run: |
          mkdir -p project
          unzip InstagramDMOnly.zip -d project
          find project -maxdepth 3 -type f


      - name: Build APK
        run: |
          ROOT=$(find project -name settings.gradle -o -name settings.gradle.kts | head -n 1)
          if [ -z "$ROOT" ]; then
            echo "ERROR: Gradle settings file not found"
            exit 1
          fi

          cd "$(dirname "$ROOT")"
          echo "Building in $(pwd)"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: InstagramDMOnly-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
